name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify release assets without publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: storydex-windows-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    with:
      enforce_coverage: true
      full: true
      run_packaged_checks: false

  release-windows:
    name: Build and publish Tauri Windows release
    needs: quality-gate
    runs-on: windows-latest
    environment: ${{ (github.event_name == 'push' || inputs.dry_run == false) && 'production' || 'release-dry-run' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/agent-runtime -> target
            apps/desktop/tauri-preview -> target

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Node dependencies
        shell: pwsh
        run: |
          npm ci --prefix apps/frontend --prefer-offline --no-audit --fund=false
          npm ci --prefix apps/desktop --prefer-offline --no-audit --fund=false

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Content -Raw -LiteralPath "apps/desktop/package.json" | ConvertFrom-Json
          $version = [string]$package.version
          if (-not $version) { throw "apps/desktop/package.json does not define a version." }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match desktop version '$tag'."
          }
          $outputs = @{
            version = $version
            tag = $tag
            setup_name = "StorydexSetup-x64-$version.exe"
            updater_name = "StorydexSetup-x64-$version.exe"
            updater_signature_name = "StorydexSetup-x64-$version.exe.sig"
            portable_name = "Storydex-win-portable.zip"
            release_name = "Storydex $tag"
          }
          foreach ($entry in $outputs.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Validate Tauri release configuration
        shell: pwsh
        run: |
          npm --prefix apps/desktop run check:encoding
          npm --prefix apps/desktop run check:release
          npm --prefix apps/desktop run test:unit

      - name: Validate production updater signing secrets
        shell: pwsh
        env:
          STORYDEX_TAURI_UPDATER_PUBKEY: ${{ secrets.STORYDEX_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("STORYDEX_TAURI_UPDATER_PUBKEY", "TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Missing production updater secret: $name" }
          }

      - name: Build signed Tauri NSIS and updater artifacts
        shell: pwsh
        env:
          STORYDEX_TAURI_UPDATER_PUBKEY: ${{ secrets.STORYDEX_TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STORYDEX_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.STORYDEX_WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: npm --prefix apps/desktop run package:win

      - name: Verify Tauri runtime and updater assets
        shell: pwsh
        run: |
          npm --prefix apps/desktop run check:packaged
          npm --prefix apps/desktop run smoke:tauri

      - name: Verify optional Authenticode signatures
        if: ${{ secrets.STORYDEX_WINDOWS_CERTIFICATE_THUMBPRINT != '' }}
        shell: pwsh
        env:
          STORYDEX_SETUP_NAME: ${{ steps.metadata.outputs.setup_name }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($target in @(
            "apps/desktop/candidate/staging/Storydex.exe",
            "apps/desktop/release/$env:STORYDEX_SETUP_NAME"
          )) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature for ${target}: $($signature.Status)" }
          }

      - name: Prepare release assets
        id: release
        shell: pwsh
        env:
          STORYDEX_VERSION: ${{ steps.metadata.outputs.version }}
          STORYDEX_SETUP_NAME: ${{ steps.metadata.outputs.setup_name }}
          STORYDEX_UPDATER_NAME: ${{ steps.metadata.outputs.updater_name }}
          STORYDEX_UPDATER_SIGNATURE_NAME: ${{ steps.metadata.outputs.updater_signature_name }}
          STORYDEX_PORTABLE_NAME: ${{ steps.metadata.outputs.portable_name }}
        run: |
          $ErrorActionPreference = "Stop"
          & ./scripts/prepare_tauri_release_bundle.ps1 `
            -Version $env:STORYDEX_VERSION `
            -SourceDirectory "apps/desktop/release" `
            -DestinationDirectory "release-assets" `
            -TestSummary "Reusable quality gate and packaged Tauri smoke passed"
          $outputs = @{
            notes_path = "release-assets/RELEASE_NOTES.md"
            setup_path = "release-assets/$env:STORYDEX_SETUP_NAME"
            updater_signature_path = "release-assets/$env:STORYDEX_UPDATER_SIGNATURE_NAME"
            portable_path = "release-assets/$env:STORYDEX_PORTABLE_NAME"
            latest_path = "release-assets/latest.json"
            sums_path = "release-assets/SHA256SUMS.txt"
          }
          foreach ($entry in $outputs.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storydex-tauri-windows-release
          path: release-assets
          retention-days: 7

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.release_name }}
          body_path: ${{ steps.release.outputs.notes_path }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.release.outputs.setup_path }}
            ${{ steps.release.outputs.updater_signature_path }}
            ${{ steps.release.outputs.portable_path }}
            ${{ steps.release.outputs.latest_path }}
            ${{ steps.release.outputs.sums_path }}
            release-assets/BUILD_MANIFEST.json
            release-assets/DEPENDENCIES.json

      - name: Publish Tauri update feed to VPS
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        shell: pwsh
        env:
          DEPLOY_HOST: ${{ secrets.STORYDEX_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.STORYDEX_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.STORYDEX_DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.STORYDEX_DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.STORYDEX_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STORYDEX_DEPLOY_KNOWN_HOSTS }}
          SETUP_NAME: ${{ steps.metadata.outputs.setup_name }}
          UPDATER_NAME: ${{ steps.metadata.outputs.updater_name }}
          PORTABLE_NAME: ${{ steps.metadata.outputs.portable_name }}
          STORYDEX_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("DEPLOY_HOST", "DEPLOY_USER", "DEPLOY_PATH", "DEPLOY_SSH_KEY")) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "Missing deploy secret: $name" }
          }
          $sshDir = Join-Path $env:RUNNER_TEMP "storydex-deploy-ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir "id_deploy"
          $knownHostsPath = Join-Path $sshDir "known_hosts"
          [IO.File]::WriteAllText($keyPath, (($env:DEPLOY_SSH_KEY -replace "`r`n", "`n").TrimEnd() + "`n"), (New-Object Text.UTF8Encoding($false)))
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null
          $port = if ($env:DEPLOY_PORT) { $env:DEPLOY_PORT } else { "22" }
          if ($env:DEPLOY_KNOWN_HOSTS) {
            [IO.File]::WriteAllText($knownHostsPath, ($env:DEPLOY_KNOWN_HOSTS -replace "`r`n", "`n"), (New-Object Text.UTF8Encoding($false)))
            $hostKeyOpts = @("-o", "UserKnownHostsFile=$knownHostsPath", "-o", "StrictHostKeyChecking=yes")
          } else {
            $hostKeyOpts = @("-o", "UserKnownHostsFile=$knownHostsPath", "-o", "StrictHostKeyChecking=accept-new")
          }
          $target = "$($env:DEPLOY_USER)@$($env:DEPLOY_HOST)"
          $remoteDir = $env:DEPLOY_PATH.TrimEnd("/")
          & ssh @(@("-i", $keyPath, "-p", $port) + $hostKeyOpts + @($target, "mkdir -p '$remoteDir'"))
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare remote update directory." }
          foreach ($name in @($env:SETUP_NAME, "$($env:SETUP_NAME).sig", $env:PORTABLE_NAME)) {
            & scp @(@("-i", $keyPath, "-P", $port) + $hostKeyOpts + @("release-assets/$name", "$target`:$remoteDir/$name"))
            if ($LASTEXITCODE -ne 0) { throw "Upload failed: $name" }
          }
          $latestTemporary = "latest.json.$($env:GITHUB_RUN_ID).tmp"
          & scp @(@("-i", $keyPath, "-P", $port) + $hostKeyOpts + @("release-assets/latest.json", "$target`:$remoteDir/$latestTemporary"))
          if ($LASTEXITCODE -ne 0) { throw "Upload failed: latest.json" }
          & ssh @(@("-i", $keyPath, "-p", $port) + $hostKeyOpts + @($target, "mv -f '$remoteDir/$latestTemporary' '$remoteDir/latest.json'"))
          if ($LASTEXITCODE -ne 0) { throw "Atomic latest.json replacement failed." }
          $published = Invoke-RestMethod -Headers @{ "Cache-Control" = "no-cache" } -Uri "https://updates.septemc.com/storydex/windows/latest.json?run=$env:GITHUB_RUN_ID"
          if ([string]$published.version -ne $env:STORYDEX_VERSION) { throw "Published latest.json version mismatch." }
          if ([string]$published.platforms.'windows-x86_64'.url -notmatch [regex]::Escape($env:UPDATER_NAME)) { throw "Published updater URL mismatch." }
          $publicBase = "https://updates.septemc.com/storydex/windows"
          foreach ($name in @($env:SETUP_NAME, "$($env:SETUP_NAME).sig", $env:PORTABLE_NAME)) {
            $response = Invoke-WebRequest -Method Head -Headers @{ "Cache-Control" = "no-cache" } -Uri "$publicBase/${name}?run=$env:GITHUB_RUN_ID"
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) { throw "Published asset unavailable: $name" }
          }
          $signatureResponse = Invoke-WebRequest -Headers @{ "Cache-Control" = "no-cache" } -Uri "$publicBase/$($env:SETUP_NAME).sig?run=$env:GITHUB_RUN_ID"
          $publishedSignature = if ($signatureResponse.Content -is [byte[]]) {
            [Text.Encoding]::UTF8.GetString($signatureResponse.Content).Trim()
          } else {
            ([string]$signatureResponse.Content).Trim()
          }
          if ($publishedSignature -ne [string]$published.platforms.'windows-x86_64'.signature) { throw "Published updater signature mismatch." }
          Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
