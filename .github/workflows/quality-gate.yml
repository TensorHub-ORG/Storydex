name: Reusable Quality Gate

on:
  workflow_call:
    inputs:
      enforce_coverage:
        description: Use release mode (zero measurement tolerance) for coverage ratchets
        required: false
        type: boolean
        default: false
      full:
        description: Run the complete cross-platform component matrix
        required: false
        type: boolean
        default: false
      run_packaged_checks:
        description: Build and validate a packaged desktop artifact (opt-in; no GUI E2E)
        required: false
        type: boolean
        default: false
      windows_release:
        description: Run the Windows release component gate without unrelated Android and legacy backend jobs
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  STORYDEX_DISABLE_NETWORK: "1"
  STORYDEX_TESTING: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      desktop: ${{ steps.scope.outputs.desktop }}
      android: ${{ steps.scope.outputs.android }}
      coomi: ${{ steps.scope.outputs.coomi }}
      pc_runtime: ${{ steps.scope.outputs.pc_runtime }}
      feedback: ${{ steps.scope.outputs.feedback }}
      upstream_verified: ${{ steps.scope.outputs.upstream_verified }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      changed_count: ${{ steps.scope.outputs.changed_count }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - name: Resolve affected quality checks
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          WINDOWS_RELEASE: ${{ inputs.windows_release }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/storydex-changed-files.txt"
          : > "$changed_file"
          force_all=false
          upstream_verified=false
          windows_only=true
          base=""
          head="$CURRENT_SHA"

          if [[ "$FULL" == "true" ]]; then
            force_all=true
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual run without the full switch checks the current commit only.
            base="$(git rev-parse "${head}^" 2>/dev/null || true)"
          else
            force_all=true
          fi

          if [[ "$force_all" != "true" ]]; then
            if [[ -z "$base" || -z "$head" ]] \
              || ! git cat-file -e "${base}^{commit}" 2>/dev/null \
              || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
              force_all=true
            else
              git -c core.quotePath=false diff --name-only --no-renames "$base" "$head" -- > "$changed_file"
              if [[ ! -s "$changed_file" ]]; then
                windows_only=false
              else
                while IFS= read -r changed_path; do
                  case "$changed_path" in
                    apps/frontend/*|apps/desktop/*|assets/*|README.md|AGENTS.md|.gitattributes|.gitignore|docs/*) ;;
                    *) windows_only=false ;;
                  esac
                done < "$changed_file"
              fi
            fi
          fi

          # A fast-forward from dev/windows already has an exact-commit Windows
          # Development CI result. Reuse it only for Windows-owned paths; API
          # failures deliberately leave the flag false, so normal scoped checks
          # still run.
          if [[ "$force_all" != "true" && "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" && "$FULL" != "true" && "$WINDOWS_RELEASE" != "true" && "$windows_only" == "true" ]]; then
            runs_json="$(curl --silent --show-error --max-time 10 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/dev-ci.yml/runs?branch=dev%2Fwindows&head_sha=$head&status=completed&per_page=20" || true)"
            if [[ -n "$runs_json" ]] && jq -e 'any(.workflow_runs[]?; .head_sha == $sha and .conclusion == "success")' --arg sha "$head" <<<"$runs_json" >/dev/null 2>&1; then
              upstream_verified=true
            fi
          fi

          node scripts/resolve_ci_scope.cjs \
            --files-from "$changed_file" \
            --github-output "$GITHUB_OUTPUT" \
            --force-all "$force_all"
          echo "upstream_verified=$upstream_verified" >> "$GITHUB_OUTPUT"

  source-policy:
    name: source-policy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - name: Encoding, conflicts, and version consistency
        shell: pwsh
        run: |
          node scripts/validate_text_encoding.cjs
          $conflicts = & git grep -n -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- . `
            ':(exclude)apps/desktop/app/**' `
            ':(exclude)apps/desktop/vendor/**' `
            ':(exclude)apps/desktop/release/**' `
            ':(exclude)releases/**'
          $searchCode = $LASTEXITCODE
          if ($searchCode -gt 1) { throw "Conflict-marker scan failed with exit code $searchCode" }
          if ($conflicts) { $conflicts | Write-Host; throw "Conflict markers found" }
          $global:LASTEXITCODE = 0
          node scripts/validate_version_consistency.cjs
          git diff --check
      - name: CI policy regressions
        run: node --test scripts/tests/check-coverage.test.cjs scripts/tests/resolve-ci-scope.test.cjs scripts/tests/ci-preflight.test.cjs
      - name: Feedback receiver regressions
        if: ${{ inputs.full || (!inputs.windows_release && needs.changes.outputs.feedback == 'true') }}
        run: python3 -m unittest discover -s deploy/storydex-feedback/tests -v

  reused-windows-checks:
    name: reused-windows-checks
    needs: changes
    if: ${{ needs.changes.outputs.upstream_verified == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reused successful dev/windows component checks for $GITHUB_SHA."

  backend-tests:
    name: backend-tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    if: ${{ needs.changes.outputs.upstream_verified != 'true' && (inputs.full || (!inputs.windows_release && needs.changes.outputs.backend == 'true')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.full && 30 || 12 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.full && '{"include":[{"os":"ubuntu-latest","python":"3.9","coverage_ratchet":false},{"os":"windows-latest","python":"3.9","coverage_ratchet":false},{"os":"windows-latest","python":"3.13","coverage_ratchet":true}]}' || '{"include":[{"os":"ubuntu-latest","python":"3.13","coverage_ratchet":true}]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            apps/backend/requirements-test.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.coverage_ratchet
        with: { node-version: "20" }
      - name: Install backend test dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r apps/backend/requirements-test.txt
      - name: Run backend tests with coverage
        working-directory: apps/backend
        run: >-
          python -m pytest -q
          -m "not coomi_runtime"
          --timeout=120
          --cov=api --cov=core --cov=services --cov-branch
          --cov-fail-under=0
          --cov-report=term-missing
          --cov-report=json:test-results/coverage.json
          --cov-report=xml:test-results/coverage.xml
          --junitxml=test-results/pytest.xml
      - name: Check versioned coverage baseline
        if: matrix.coverage_ratchet
        working-directory: apps/backend
        run: >-
          node ../../scripts/check_coverage.cjs
          --component=backend
          --report=test-results/coverage.json
          --mode=${{ inputs.enforce_coverage && 'release' || 'advisory' }}
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.os }}-py${{ matrix.python }}
          path: apps/backend/test-results
          if-no-files-found: warn

  pc-runtime-tests:
    name: pc-runtime-tests
    needs: changes
    if: ${{ needs.changes.outputs.upstream_verified != 'true' && (inputs.full || inputs.windows_release || needs.changes.outputs.pc_runtime == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/agent-runtime -> target
      - name: Install pinned Rust dependency auditor
        if: inputs.full || inputs.windows_release
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit Rust dependencies
        if: inputs.full || inputs.windows_release
        shell: pwsh
        run: ./scripts/run_rust_dependency_audit.ps1
      - name: Check storydex-agentd formatting
        run: cargo fmt --manifest-path apps/desktop/agent-runtime/Cargo.toml --package storydex-agentd -- --check
      - name: Lint storydex-agentd
        run: cargo clippy --manifest-path apps/desktop/agent-runtime/Cargo.toml --locked -p storydex-agentd --all-targets --no-deps -- -D warnings
      - name: Test Storydex PC Agent runtime
        run: cargo test --manifest-path apps/desktop/agent-runtime/Cargo.toml --locked --workspace
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.full || inputs.windows_release
        with: { python-version: "3.13" }
      - name: Build isolated storydex-agentd sidecar
        if: inputs.full || inputs.windows_release
        run: cargo build --manifest-path apps/desktop/agent-runtime/Cargo.toml --release --locked -p storydex-agentd
      - name: Build current-commit Storydex PC Agent runtime
        if: inputs.full || inputs.windows_release
        run: cargo build --manifest-path apps/desktop/agent-runtime/Cargo.toml --release --locked -p storydex-coomi-bridge
      - name: Verify pinned runtime and backend contract
        if: inputs.full || inputs.windows_release
        run: python scripts/verify_coomi_runtime.py

  backend-compatibility:
    name: backend-compatibility
    needs: changes
    if: ${{ needs.changes.outputs.upstream_verified != 'true' && !inputs.full && !inputs.windows_release && needs.changes.outputs.backend == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            apps/backend/requirements-test.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -r apps/backend/requirements-test.txt
      - name: Compile and import all backend modules on packaged Python
        working-directory: apps/backend
        run: |
          python -m compileall -q api core services
          python -c "import main; assert main.app.title"
      - name: Session, SSE, Git, and runtime integration regressions
        working-directory: apps/backend
        run: >-
          python -m pytest -q
          --timeout=120
          tests/test_agent_stream_responsiveness.py
          tests/test_agent_git_autocommit_service.py
          tests/test_storydex_intent_service.py
          tests/test_storydex_runtime_fixes.py
          --junitxml=test-results/integration.xml
      - name: Upload compatibility and integration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-compatibility-results
          path: apps/backend/test-results
          if-no-files-found: warn

  frontend-tests:
    name: frontend-tests
    needs: changes
    if: ${{ needs.changes.outputs.upstream_verified != 'true' && (inputs.full || inputs.windows_release || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --fund=false
        working-directory: apps/frontend
      - run: npm run type-check
        working-directory: apps/frontend
      - run: npm run test:coverage
        working-directory: apps/frontend
      - name: Check versioned coverage baseline
        working-directory: apps/frontend
        run: >-
          node ../../scripts/check_coverage.cjs
          --component=frontend
          --report=test-results/coverage/coverage-summary.json
          --mode=${{ inputs.enforce_coverage && 'release' || 'advisory' }}
      - run: npm run build:bundle
        working-directory: apps/frontend
      - run: npm run test:regressions
        working-directory: apps/frontend
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: apps/frontend/test-results
          if-no-files-found: warn

  desktop-unit-tests:
    name: desktop-unit-tests
    needs: changes
    if: ${{ needs.changes.outputs.upstream_verified != 'true' && (inputs.full || inputs.windows_release || needs.changes.outputs.desktop == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri-preview -> target
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run test:unit
        working-directory: apps/desktop
      - run: npm run check:release
        working-directory: apps/desktop
      - name: Check Tauri Stable formatting
        run: cargo fmt --manifest-path apps/desktop/tauri-preview/Cargo.toml -- --check
      - name: Lint Tauri Stable shell
        run: cargo clippy --manifest-path apps/desktop/tauri-preview/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Tauri Stable shell
        run: cargo test --manifest-path apps/desktop/tauri-preview/Cargo.toml --locked

  android-tests:
    name: android-tests
    needs: changes
    if: ${{ needs.changes.outputs.upstream_verified != 'true' && !inputs.windows_release && (inputs.full || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/android/agent-runtime -> target
      - name: Test Android Agent runtime
        if: ${{ inputs.full || needs.changes.outputs.coomi == 'true' }}
        run: cargo test --manifest-path apps/android/agent-runtime/Cargo.toml --locked --workspace
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/android-frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --fund=false
        working-directory: apps/android-frontend
      - run: npm run build
        working-directory: apps/android-frontend
      - run: npm run test:random
        working-directory: apps/android-frontend

  desktop-package-check:
    name: desktop-package-check
    if: inputs.run_packaged_checks
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci --prefer-offline --no-audit --fund=false
        working-directory: apps/frontend
      - run: npm ci --prefer-offline --no-audit --fund=false
        working-directory: apps/desktop
      - name: Generate ephemeral updater key
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "storydex-tauri-ci.key"
          npm --prefix apps/desktop exec -- tauri signer generate --ci --write-keys $keyPath
          "STORYDEX_TAURI_UPDATER_PUBKEY=$((Get-Content -Raw -LiteralPath "$keyPath.pub").Trim())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Tauri desktop and signed updater assets
        run: npm run build:desktop
        working-directory: apps/desktop
      - name: Validate Tauri packaged assets
        run: npm run check:packaged
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storydex-tauri-runtime
          path: |
            apps/desktop/candidate/staging
            apps/desktop/release
          retention-days: 3

  quality-gate-summary:
    name: quality-gate-summary
    if: always()
    needs:
      - changes
      - source-policy
      - reused-windows-checks
      - backend-tests
      - backend-compatibility
      - pc-runtime-tests
      - frontend-tests
      - desktop-unit-tests
      - android-tests
      - desktop-package-check
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ inputs.full }}
          WINDOWS_RELEASE: ${{ inputs.windows_release }}
          PACKAGED_CHECKS: ${{ inputs.run_packaged_checks }}
          UPSTREAM_VERIFIED: ${{ needs.changes.outputs.upstream_verified }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          PC_RUNTIME: ${{ needs.changes.outputs.pc_runtime }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
          DESKTOP: ${{ needs.changes.outputs.desktop }}
          ANDROID: ${{ needs.changes.outputs.android }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          required = {
              "changes",
              "source-policy",
          }
          full = os.environ["FULL"].lower() == "true"
          windows_release = os.environ["WINDOWS_RELEASE"].lower() == "true"
          packaged_checks = os.environ["PACKAGED_CHECKS"].lower() == "true"
          upstream_verified = os.environ["UPSTREAM_VERIFIED"].lower() == "true"
          backend = os.environ["BACKEND"].lower() == "true"
          pc_runtime = os.environ["PC_RUNTIME"].lower() == "true"
          frontend = os.environ["FRONTEND"].lower() == "true"
          desktop = os.environ["DESKTOP"].lower() == "true"
          android = os.environ["ANDROID"].lower() == "true"
          if not upstream_verified and (full or (backend and not windows_release)):
              required.add("backend-tests")
          if not upstream_verified and backend and not full and not windows_release:
              required.add("backend-compatibility")
          if not upstream_verified and (full or windows_release or pc_runtime):
              required.add("pc-runtime-tests")
          if not upstream_verified and (full or windows_release or frontend):
              required.add("frontend-tests")
          if not upstream_verified and (full or windows_release or desktop):
              required.add("desktop-unit-tests")
          if not upstream_verified and not windows_release and (full or android):
              required.add("android-tests")
          if packaged_checks:
              required.add("desktop-package-check")
          if upstream_verified:
              required.add("reused-windows-checks")
          failed = {
              name: results[name]["result"]
              for name in sorted(required)
              if results[name]["result"] != "success"
          }
          if failed:
              print("Quality gate failed:", failed)
              sys.exit(1)
          profile = "full" if full else ("windows-release" if windows_release else "standard")
          if upstream_verified:
              profile += " (component checks reused from dev/windows)"
          if packaged_checks:
              profile += " (packaged assets validated; GUI E2E disabled)"
          print(f"All Storydex {profile} quality gates passed.")
          PY
