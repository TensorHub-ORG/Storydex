name: Reusable Quality Gate

on:
  workflow_call:
    inputs:
      enforce_coverage:
        description: Use release mode (zero measurement tolerance) for coverage ratchets
        required: false
        type: boolean
        default: false
      full:
        description: Run release-grade cross-platform, packaging, and packaged E2E checks
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  STORYDEX_DISABLE_NETWORK: "1"
  STORYDEX_TESTING: "1"

jobs:
  source-policy:
    name: source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - name: Encoding, conflicts, and version consistency
        shell: pwsh
        run: |
          node scripts/validate_text_encoding.cjs
          $conflicts = & git grep -n -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- . `
            ':(exclude)apps/desktop/app/**' `
            ':(exclude)apps/desktop/vendor/**' `
            ':(exclude)apps/desktop/release/**' `
            ':(exclude)releases/**'
          $searchCode = $LASTEXITCODE
          if ($searchCode -gt 1) { throw "Conflict-marker scan failed with exit code $searchCode" }
          if ($conflicts) { $conflicts | Write-Host; throw "Conflict markers found" }
          $global:LASTEXITCODE = 0
          node scripts/validate_version_consistency.cjs
          git diff --check
      - name: Coverage gate parser regressions
        run: node --test scripts/tests/check-coverage.test.cjs

  backend-tests:
    name: backend-tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.full && '{"include":[{"os":"ubuntu-latest","python":"3.9","coverage_ratchet":false},{"os":"windows-latest","python":"3.9","coverage_ratchet":false},{"os":"windows-latest","python":"3.13","coverage_ratchet":true}]}' || '{"include":[{"os":"ubuntu-latest","python":"3.13","coverage_ratchet":true}]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            apps/backend/requirements-test.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - name: Install backend test dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r apps/backend/requirements-test.lock
      - name: Test and build Storydex Coomi Rust runtime
        run: |
          cargo test --manifest-path vendor/coomi-rs/Cargo.toml --locked --workspace
          cargo build --manifest-path vendor/coomi-rs/Cargo.toml --release --locked -p storydex-coomi-bridge
      - name: Verify pinned Coomi runtime
        run: python scripts/verify_coomi_runtime.py
      - name: Run backend tests with coverage
        working-directory: apps/backend
        run: >-
          python -m pytest -q
          --cov=api --cov=core --cov=services --cov-branch
          --cov-fail-under=0
          --cov-report=term-missing
          --cov-report=json:test-results/coverage.json
          --cov-report=xml:test-results/coverage.xml
          --junitxml=test-results/pytest.xml
      - name: Enforce versioned coverage ratchet
        if: matrix.coverage_ratchet
        working-directory: apps/backend
        run: >-
          node ../../scripts/check_coverage.cjs
          --component=backend
          --report=test-results/coverage.json
          --mode=${{ inputs.enforce_coverage && 'release' || 'ci' }}
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.os }}-py${{ matrix.python }}
          path: apps/backend/test-results
          if-no-files-found: warn

  backend-compatibility:
    name: backend-compatibility
    if: ${{ !inputs.full }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            apps/backend/requirements-test.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r apps/backend/requirements-test.lock
      - name: Compile and import all backend modules on packaged Python
        working-directory: apps/backend
        run: |
          python -m compileall -q api core services
          python -c "import main; assert main.app.title"

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run type-check
        working-directory: apps/frontend
      - run: npm run test:coverage
        working-directory: apps/frontend
      - name: Enforce versioned coverage ratchet
        working-directory: apps/frontend
        run: >-
          node ../../scripts/check_coverage.cjs
          --component=frontend
          --report=test-results/coverage/coverage-summary.json
          --mode=${{ inputs.enforce_coverage && 'release' || 'ci' }}
      - run: npm run build
        working-directory: apps/frontend
      - run: npm run test:regressions
        working-directory: apps/frontend
      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: apps/frontend/test-results
          if-no-files-found: warn

  desktop-unit-tests:
    name: desktop-unit-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run test:unit
        working-directory: apps/desktop
      - run: npm run check:release
        working-directory: apps/desktop

  integration-tests:
    name: integration-tests
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            apps/backend/requirements-test.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r apps/backend/requirements-test.lock
      - name: Session, SSE, Git, and runtime integration regressions
        working-directory: apps/backend
        run: >-
          python -m pytest -q
          tests/test_agent_stream_responsiveness.py
          tests/test_agent_git_autocommit_service.py
          tests/test_storydex_intent_service.py
          tests/test_storydex_runtime_fixes.py
          --junitxml=test-results/integration.xml
      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: apps/backend/test-results
          if-no-files-found: warn

  desktop-package-smoke:
    name: desktop-package-smoke
    if: inputs.full
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.9" }
      - run: npm ci
        working-directory: apps/frontend
      - run: npm ci
        working-directory: apps/desktop
      - name: Prepare embedded Python
        shell: pwsh
        run: ./scripts/bootstrap_python39.ps1 -InstallRequirements
      - name: Build unpacked desktop
        shell: cmd
        run: npm --prefix apps/desktop run build:desktop
      - run: npm run check:packaged
        working-directory: apps/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storydex-win-unpacked
          path: apps/desktop/release/win-unpacked
          retention-days: 3

  electron-e2e:
    name: electron-e2e
    if: inputs.full
    needs: desktop-package-smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storydex-win-unpacked
          path: apps/desktop/release/win-unpacked
      - name: Run packaged Electron E2E
        working-directory: apps/desktop
        run: npm run test:e2e
      - name: Upload Electron diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: electron-e2e-diagnostics
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: warn

  quality-gate-summary:
    name: quality-gate-summary
    if: always()
    needs:
      - source-policy
      - backend-tests
      - backend-compatibility
      - frontend-tests
      - desktop-unit-tests
      - integration-tests
      - desktop-package-smoke
      - electron-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ inputs.full }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          required = {
              "source-policy",
              "backend-tests",
              "frontend-tests",
              "desktop-unit-tests",
          }
          if os.environ["FULL"].lower() == "true":
              required.update({"desktop-package-smoke", "electron-e2e"})
          else:
              required.update({"backend-compatibility", "integration-tests"})
          failed = {
              name: results[name]["result"]
              for name in sorted(required)
              if results[name]["result"] != "success"
          }
          if failed:
              print("Quality gate failed:", failed)
              sys.exit(1)
          profile = "full" if os.environ["FULL"].lower() == "true" else "standard"
          print(f"All Storydex {profile} quality gates passed.")
          PY
