name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full cross-platform, packaging, and packaged Tauri lifecycle gate
        required: true
        default: false
        type: boolean

concurrency:
  group: storydex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    with:
      # Ordinary pushes and pull requests use affected-component checks.
      # Full CI stays explicit for release validation and manual runs.
      full: ${{ inputs.full == true }}

