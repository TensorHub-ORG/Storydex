name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete cross-platform component matrix
        required: true
        default: false
        type: boolean
      packaged:
        description: Build and validate the Windows package without GUI E2E
        required: true
        default: false
        type: boolean

concurrency:
  group: storydex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    with:
      # Ordinary pushes and pull requests use affected-component checks.
      # Full CI and the optional package check stay explicit for release validation and manual runs.
      full: ${{ inputs.full == true }}
      run_packaged_checks: ${{ inputs.packaged == true }}
