name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run packaging and packaged Electron E2E in addition to the standard gate
        required: true
        default: false
        type: boolean

concurrency:
  group: storydex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml
    with:
      full: ${{ inputs.full || false }}

