<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coomi 回复布局预览（Claude Desktop 风格）</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      .demo-root {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        height: 100%;
        font-family: var(--font-ui);
      }
      .demo-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px 16px;
        border-right: 1px solid var(--border-subtle);
        background: var(--bg-sidebar);
        overflow: auto;
      }
      .demo-panel-title {
        margin-top: 6px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .demo-btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .demo-btn {
        padding: 7px 12px;
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 12px;
        cursor: pointer;
      }
      .demo-btn:hover {
        border-color: color-mix(in srgb, var(--accent) 36%, var(--border-subtle));
      }
      .demo-btn.primary {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: var(--accent-contrast);
      }
      .demo-btn.active {
        border-color: color-mix(in srgb, var(--accent) 48%, var(--border-subtle));
        background: var(--accent-soft);
        color: var(--accent-strong);
      }
      .demo-hint {
        margin: 8px 0 0;
        color: var(--text-muted);
        font-size: 11.5px;
        line-height: 1.7;
      }
      .demo-stage {
        min-width: 0;
        overflow: auto;
        background: var(--bg-agent);
      }
      /* 模拟右侧 Coomi 面板的实际宽度 */
      .demo-surface {
        max-width: 460px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/coomi-claude-demo.ts"></script>
  </body>
</html>
