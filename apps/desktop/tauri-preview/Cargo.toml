[package]
name = "storydex-tauri"
version = "2.0.5"
description = "Storydex Tauri 2 desktop shell"
authors = ["Storydex"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rfd = "0.15"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.9"
tauri-plugin-single-instance = "2.4"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
