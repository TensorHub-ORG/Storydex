[package]
name = "storydex-tauri-preview"
version = "0.1.0"
description = "Isolated Storydex Tauri 2 preview shell"
authors = ["Storydex"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
