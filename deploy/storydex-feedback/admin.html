<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Storydex 反馈管理</title>
  <style>
    :root { color-scheme: dark; --bg:#11151b; --panel:#191f27; --line:#343c47; --text:#eef2f6; --dim:#9ba7b4; --accent:#38a3a5; --danger:#ef6a67; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .shell { width:min(1120px,100%); margin:auto; padding:24px 18px 48px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
    h1 { margin:0; font-size:22px; letter-spacing:0; }
    .sub,.muted { color:var(--dim); }
    .login { width:min(380px,100%); margin:12vh auto; padding:24px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
    .login h2 { margin:0 0 18px; font-size:18px; }
    input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:#0f1318; color:var(--text); }
    button { min-height:38px; padding:0 14px; border:1px solid var(--line); border-radius:6px; background:#202833; color:var(--text); }
    button.primary { border-color:var(--accent); background:var(--accent); color:#071415; font-weight:700; }
    .login button { width:100%; margin-top:12px; }
    .error { margin-top:10px; color:var(--danger); }
    .toolbar { display:grid; grid-template-columns:minmax(220px,1fr) auto auto; gap:10px; margin-bottom:14px; }
    .grid { display:grid; grid-template-columns:minmax(320px,.9fr) minmax(420px,1.35fr); min-height:620px; border:1px solid var(--line); background:var(--panel); }
    .list { border-right:1px solid var(--line); overflow:auto; }
    .item { width:100%; min-height:0; padding:13px 15px; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; text-align:left; }
    .item:hover,.item.active { background:#242d38; }
    .item-top { display:flex; justify-content:space-between; gap:10px; }
    .tag { color:#79d4ce; }
    .desc { margin-top:5px; color:var(--text); overflow-wrap:anywhere; }
    .detail { padding:20px; overflow:auto; }
    .detail h2 { margin:0 0 14px; font-size:18px; }
    dl { display:grid; grid-template-columns:110px minmax(0,1fr); gap:8px 12px; margin:0 0 18px; }
    dt { color:var(--dim); }
    dd { margin:0; overflow-wrap:anywhere; }
    pre { margin:8px 0 18px; padding:12px; overflow:auto; border:1px solid var(--line); border-radius:6px; background:#0f1318; color:#cbd5df; white-space:pre-wrap; }
    .images { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .images img { width:100%; aspect-ratio:4/3; object-fit:contain; border:1px solid var(--line); background:#0b0e12; }
    .empty { padding:48px 20px; color:var(--dim); text-align:center; }
    [hidden] { display:none !important; }
    @media (max-width:780px) { .grid { grid-template-columns:1fr; }.list { max-height:340px; border-right:0; border-bottom:1px solid var(--line); }.toolbar { grid-template-columns:1fr auto; }.toolbar .logout { grid-column:1/-1; }.images { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="shell">
    <section id="login" class="login">
      <h2>Storydex 反馈管理</h2>
      <p class="muted">使用 Coomi 反馈后台的管理员密码登录。</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="管理员密码">
      <button class="primary" id="loginButton">登录</button>
      <div id="loginError" class="error"></div>
    </section>
    <section id="app" hidden>
      <header><div><h1>Storydex 反馈管理</h1><div class="sub">错误上报、主动反馈与截图</div></div></header>
      <div class="toolbar">
        <input id="query" type="search" placeholder="搜索描述、分类、联系方式或 ID">
        <button id="refresh">刷新</button>
        <button id="logout" class="logout">退出登录</button>
      </div>
      <div class="grid">
        <div id="list" class="list"></div>
        <article id="detail" class="detail"><div class="empty">选择一条反馈查看详情</div></article>
      </div>
    </section>
  </main>
  <script>
    const base = '/storydex/feedback';
    const tokenKey = 'storydex_feedback_admin_token';
    let token = localStorage.getItem(tokenKey) || '';
    let selected = '';
    const el = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(path, options = {}) {
      const headers = Object.assign({}, options.headers || {}, token ? {Authorization: `Bearer ${token}`} : {});
      const response = await fetch(path, Object.assign({}, options, {headers}));
      const body = await response.json().catch(() => ({}));
      if (response.status === 401 && path.indexOf('/login') < 0) logout();
      if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
      return body;
    }
    function showApp() { el('login').hidden = true; el('app').hidden = false; loadList(); }
    function showLogin() { el('login').hidden = false; el('app').hidden = true; }
    function logout() { token=''; selected=''; localStorage.removeItem(tokenKey); showLogin(); }
    async function login() {
      el('loginError').textContent = '';
      try {
        const body = await api(`${base}/api/admin/login`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:el('password').value})});
        token = body.token; localStorage.setItem(tokenKey, token); el('password').value=''; showApp();
      } catch (error) { el('loginError').textContent = error.message; }
    }
    async function loadList() {
      const query = encodeURIComponent(el('query').value.trim());
      try {
        const body = await api(`${base}/admin/api/list?q=${query}&limit=200`);
        el('list').innerHTML = body.items.length ? body.items.map(item => `<button class="item ${selected===item.id?'active':''}" data-id="${escapeHtml(item.id)}"><div class="item-top"><span class="tag">${escapeHtml(item.category)} · ${escapeHtml(item.source)}</span><span class="muted">${escapeHtml(new Date(item.received_at).toLocaleString())}</span></div><div class="desc">${escapeHtml(item.description.slice(0,180))}</div><div class="muted">${item.image_count} 张图片 · ${escapeHtml(item.contact || '未留联系方式')}</div></button>`).join('') : '<div class="empty">暂无反馈</div>';
        document.querySelectorAll('.item').forEach(node => node.addEventListener('click', () => loadDetail(node.dataset.id)));
      } catch (error) { el('list').innerHTML = `<div class="empty error">${escapeHtml(error.message)}</div>`; }
    }
    async function authImage(url) {
      const response = await fetch(url, {headers:{Authorization:`Bearer ${token}`}});
      if (!response.ok) throw new Error('图片加载失败');
      return URL.createObjectURL(await response.blob());
    }
    async function loadDetail(id) {
      selected=id; await loadList();
      try {
        const data = await api(`${base}/admin/api/detail?id=${encodeURIComponent(id)}`);
        el('detail').innerHTML = `<h2>${escapeHtml(data.category)} · ${escapeHtml(data.source)}</h2><dl><dt>接收时间</dt><dd>${escapeHtml(new Date(data.received_at).toLocaleString())}</dd><dt>反馈 ID</dt><dd>${escapeHtml(data.id)}</dd><dt>提交 ID</dt><dd>${escapeHtml(data.submission_id)}</dd><dt>联系方式</dt><dd>${escapeHtml(data.contact || '未填写')}</dd><dt>客户端 IP</dt><dd>${escapeHtml(data.client_ip)}</dd><dt>描述</dt><dd>${escapeHtml(data.description)}</dd></dl><h3>错误信息</h3><pre>${escapeHtml(JSON.stringify(data.error,null,2))}</pre><h3>诊断信息</h3><pre>${escapeHtml(JSON.stringify(data.diagnostics,null,2))}</pre><h3>截图</h3><div id="images" class="images">${data.images.length?'正在加载...':'无截图'}</div>`;
        if (data.images.length) {
          const urls = await Promise.all(data.images.map(image => authImage(image.url)));
          el('images').innerHTML = urls.map((url,index) => `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${escapeHtml(data.images[index].original_name)}"></a>`).join('');
        }
      } catch (error) { el('detail').innerHTML=`<div class="empty error">${escapeHtml(error.message)}</div>`; }
    }
    el('loginButton').addEventListener('click', login);
    el('password').addEventListener('keydown', event => { if(event.key==='Enter') login(); });
    el('refresh').addEventListener('click', loadList);
    el('logout').addEventListener('click', logout);
    let searchTimer; el('query').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer=setTimeout(loadList,250); });
    token ? showApp() : showLogin();
  </script>
</body>
</html>
